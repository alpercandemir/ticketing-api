spring:
  application:
    name: ticketing-api

  datasource:
    url: jdbc:h2:mem:ticketingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: Y2hhbmdlbWUtdGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS0yNTZiaXQtb3ItbW9yZTEyMzQ1Njc4OTA=
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
